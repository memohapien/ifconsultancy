# IF Consultancy — Cloudflare Pages configuration
# Docs: https://developers.cloudflare.com/pages/functions/wrangler-configuration/

name = "ifconsultancy"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# --- Bindings (uncomment and fill IDs after creating resources) ---

# D1 Database — for contact form submissions
# Create: wrangler d1 create ifconsultancy-db
# Schema: wrangler d1 execute ifconsultancy-db --file=./db/schema.sql
# [[d1_databases]]
# binding = "DB"
# database_name = "ifconsultancy-db"
# database_id = ""

# KV Namespace — for rate limiting
# Create: wrangler kv namespace create RATE_KV
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = ""

# KV Namespace — for CMS content storage
# Create: wrangler kv namespace create CONTENT_KV
# [[kv_namespaces]]
# binding = "CONTENT_KV"
# id = ""

# R2 Bucket — for logo image storage (Phase 2)
# Create: wrangler r2 bucket create ifconsultancy-logos
# [[r2_buckets]]
# binding = "LOGOS_R2"
# bucket_name = "ifconsultancy-logos"

# --- Environment variables (set via Cloudflare dashboard) ---
# TURNSTILE_SECRET_KEY — Cloudflare Turnstile secret key
# RESEND_API_KEY       — Resend transactional email API key
# RESEND_FROM          — Sender address (e.g. "IF Consultancy <noreply@ifconsultancy-tr.com>")
# NOTIFY_EMAIL         — Notification recipient (default: if@ifconsultancy-tr.com)
# ADMIN_KEY            — Secret key for admin panel authentication
